[package]
name = "whatsapp-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web   = "4.10.2"
anyhow      = "1.0.100"
chrono      = { version = "0.4.39", features = ["serde"] }
dotenv      = "0.15.0"
graflog     = "1.5.0"
reqwest     = { version = "0.12.15", features = ["json"] }
hex         = "0.4.3"
hmac        = "0.12.1"
serde       = { version = "1.0.219", features = ["derive"] }
serde_json  = "1.0.149"
sha2        = "0.10.8"
serde_yaml  = "0.9.34"
thiserror   = "2.0"
tokio       = { version = "1.44.2", features = ["full"] }
urlencoding = "2.1"
uuid        = { version = "1.16.0", features = ["v4"] }
