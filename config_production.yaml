# Production configuration for the messaging bridge (WhatsApp + Telegram).
#
# Loaded via CONFIG_PATH=config_production.yaml in ecosystem.config.js. The dev
# config.yaml stays pointed at local ports; this file is the one the production
# host actually reads, because the two differ in exactly one dangerous way: the
# gateway's port.

server:
  host: "0.0.0.0"
  port: 8095

# The store's HTTP API. config.yaml in the store pins this to 127.0.0.1:5007
# and pm2 does not override it.
store:
  address: "http://127.0.0.1:5007"

# The api0 gateway. Every tool call goes here as an MCP client, with the linked
# person's own key — the bridge never executes a tool itself.
#
# The gateway listens on 5009 — the port nginx proxies gateway.api0.ai to
# (checked on the VPS with `ss -ltnp`). PM2 sets API0__SERVER__PORT=50054, but
# that override has no effect on the gateway; 50054 reaches nothing, and every
# message failed with "Gateway unreachable".
gateway:
  address: "http://127.0.0.1:5009"

# The built-in AI provider (DeepSeek, key in DEEPSEEK_API_KEY). The provider
# chosen in Admin → Messaging assistant (DeepSeek or Mistral) overrides it.
llm:
  model: "deepseek-chat"
  max_tokens: 1024
