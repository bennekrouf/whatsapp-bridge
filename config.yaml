server:
  host: "0.0.0.0"
  port: 8095

store:
  address: "http://127.0.0.1:5007"

# The api0 gateway. Every tool call goes here as an MCP client, with the linked
# person's own key — the bridge never executes a tool itself.
gateway:
  address: "http://127.0.0.1:5009"

# The built-in AI provider (DeepSeek, key in DEEPSEEK_API_KEY). The provider
# chosen in Admin → Messaging assistant (DeepSeek or Mistral) overrides it.
llm:
  model: "deepseek-chat"
  max_tokens: 1024
