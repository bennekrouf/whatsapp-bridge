name: CI — WhatsApp Bridge

# Checks only. The bridge is built and deployed on the VPS by the gateway's
# deploy/update.sh, not from here.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Clippy & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain rust-toolchain.toml names, clippy included.
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Lints fail the build, so a warning never reaches master.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test
